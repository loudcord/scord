
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #292929;
      cursor: pointer;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #292929;
    }

    #exitPrompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,0.9);
      color: white;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 13px 22px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <main id="screen"></main>

  <div id="exitPrompt">
    <div>
      <h2>Уже уходишь?</h2>
      <p>Ты действительно хочешь выйти?</p>
      <br>
      <button id="stay">Остаться</button>
      <button id="leave">Выйти</button>
    </div>
  </div>

  <audio id="sound" src="./assets/sound.mp3" loop preload="auto"></audio>

  <script>
    const screen = document.getElementById("screen");
    const sound = document.getElementById("sound");
    const exitPrompt = document.getElementById("exitPrompt");

    let started = false;
    let intentionalExit = false;

    async function startPrank() {
      if (started) return;

      started = true;

      try {
        await sound.play();
      } catch (error) {
        console.error("Audio error:", error);
      }

      try {
        await document.documentElement.requestFullscreen();
      } catch (error) {
        console.log("Fullscreen unavailable:", error);
      }
    }

    screen.addEventListener("click", startPrank);

    document.addEventListener("fullscreenchange", () => {
      if (!started) return;

      if (!document.fullscreenElement && !intentionalExit) {
        exitPrompt.style.display = "flex";
      }

      if (document.fullscreenElement) {
        exitPrompt.style.display = "none";
        intentionalExit = false;
      }
    });

    document.getElementById("stay").addEventListener("click", async () => {
      exitPrompt.style.display = "none";

      try {
        await document.documentElement.requestFullscreen();
      } catch (error) {
        console.log(error);
      }
    });

    document.getElementById("leave").addEventListener("click", () => {
      intentionalExit = true;
      exitPrompt.style.display = "none";
      sound.pause();
    });
  </script>

</body>
</html>
