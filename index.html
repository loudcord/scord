
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> </title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #292929;
}

#screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #292929;
  cursor: pointer;
}

#picture {
  display: none;
  width: 100vw;
  height: 100vh;
  object-fit: fill;
}

#exitPrompt {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(0,0,0,.9);
  color: white;
  font-family: Arial, sans-serif;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.promptContent {
  padding: 25px;
}

button {
  padding: 13px 22px;
  margin: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="screen">
  <img id="picture" src="./assets/image.png" alt="">
</div>

<div id="exitPrompt">
  <div class="promptContent">
    <h2>Ты действительно хочешь выйти?</h2>
    <button id="stay">Остаться</button>
    <button id="leave">Выйти</button>
  </div>
</div>

<audio id="sound" src="./assets/sound.mp3" loop preload="auto"></audio>

<script>
const screen = document.getElementById("screen");
const picture = document.getElementById("picture");
const sound = document.getElementById("sound");
const prompt = document.getElementById("exitPrompt");

let started = false;
let allowExit = false;

function startPrank() {
  if (started) return;

  started = true;

  picture.style.display = "block";

  sound.volume = 1.0;
  sound.play().catch(error => {
    console.error("Ошибка звука:", error);
  });

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(error => {
      console.error("Ошибка Fullscreen:", error);
    });
  }
}

screen.addEventListener("click", startPrank);

// Подтверждение при закрытии или обновлении страницы
window.addEventListener("beforeunload", (event) => {
  if (started && !allowExit) {
    event.preventDefault();
    event.returnValue = "";
  }
});

// Если пользователь нажал Esc и вышел из полноэкранного режима
document.addEventListener("fullscreenchange", () => {
  if (!started || allowExit) return;

  if (!document.fullscreenElement) {
    prompt.style.display = "flex";
  } else {
    prompt.style.display = "none";
  }
});

// Остаться — снова включить полноэкранный режим
document.getElementById("stay").addEventListener("click", () => {
  prompt.style.display = "none";

  document.documentElement.requestFullscreen().catch(error => {
    console.error(error);
  });
});

// Выйти — добровольно остановить звук и показать пустой экран
document.getElementById("leave").addEventListener("click", () => {
  allowExit = true;
  sound.pause();
  sound.currentTime = 0;
  prompt.style.display = "none";
  picture.style.display = "none";

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
});
</script>

</body>
</html>
