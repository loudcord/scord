
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> </title>

<style>
* {
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    box-sizing: border-box !important;
}

html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden !important;
    background: #000 !important;
}

#screen {
    position: fixed;
    inset: 0;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden;
    background: #000;
    cursor: pointer;
}

#picture {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw !important;
    height: 100vh !important;
    min-width: 100vw;
    min-height: 100vh;
    max-width: none !important;
    max-height: none !important;
    object-fit: fill !important;
}

#exitPrompt {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.92);
    color: white;
    font-family: Arial, sans-serif;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.promptContent {
    padding: 25px !important;
}

.promptContent h2 {
    margin-bottom: 20px !important;
}

button {
    padding: 13px 22px !important;
    margin: 10px !important;
    border: none !important;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}
</style>
</head>

<body>

<div id="screen">
    <img id="picture" src="./assets/image.png" alt="">
</div>

<div id="exitPrompt">
    <div class="promptContent">
        <h2>Ты действительно хочешь выйти?</h2>
        <button id="stay">Остаться</button>
        <button id="leave">Выйти</button>
    </div>
</div>

<audio id="sound" src="./assets/sound.mp3" loop preload="auto"></audio>

<script>
const screen = document.getElementById("screen");
const picture = document.getElementById("picture");
const sound = document.getElementById("sound");
const prompt = document.getElementById("exitPrompt");

let started = false;
let allowExit = false;

function startPrank() {
    if (started) return;

    started = true;

    picture.style.display = "block";

    sound.volume = 1.0;
    sound.play().catch(error => console.log("Audio:", error));

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen()
            .catch(error => console.log("Fullscreen:", error));
    }
}

screen.addEventListener("click", startPrank);

window.addEventListener("beforeunload", event => {
    if (started && !allowExit) {
        event.preventDefault();
        event.returnValue = "";
    }
});

document.addEventListener("fullscreenchange", () => {
    if (!started || allowExit) return;

    if (!document.fullscreenElement) {
        prompt.style.display = "flex";
    } else {
        prompt.style.display = "none";
    }
});

document.getElementById("stay").addEventListener("click", () => {
    prompt.style.display = "none";

    document.documentElement.requestFullscreen()
        .catch(error => console.log(error));
});

document.getElementById("leave").addEventListener("click", () => {
    allowExit = true;

    sound.pause();
    sound.currentTime = 0;

    picture.style.display = "none";
    prompt.style.display = "none";

    if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }
});
</script>

</body>
</html>
